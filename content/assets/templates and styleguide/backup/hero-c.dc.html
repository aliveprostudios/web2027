<!DOCTYPE html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/alive-prostudios-design-system-a3c754b9-e5d8-4cbb-81f3-bac5a50d8847/colors_and_type.css">

  <style>

<div style="min-height:100vh;display:flex;flex-direction:column;font-family:var(--font-sans);background:#fff;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:28px clamp(24px,4vw,56px)">

    <button aria-label="Menu" style="display:flex;flex-direction:column;gap:6px;background:none;border:none;cursor:pointer;padding:8px">
      <span style="display:block;width:30px;height:3px;background:#000"></span>
      <span style="display:block;width:30px;height:3px;background:#000"></span>
    </button>
  </header>
  <main style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(24px,4vw,56px) 48px">
    <p style="font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--brand-forest);margin:0 0 24px;animation:heroFade 800ms var(--ease-out) both 100ms"><span style="color:#F76E1E">(01)</span>&nbsp;&nbsp;Brand Transformation Since 1997</p>
    <h1 style="font-family:var(--font-condensed);font-weight:800;font-size:clamp(80px,11vw,190px);line-height:0.92;letter-spacing:0;color:#000;margin:0;text-transform:uppercase">
      <span style="display:block;overflow:hidden"><span style="display:block;animation:heroRise 900ms var(--ease-out) both 150ms">Fragmented</span></span>
      <span style="display:block;overflow:hidden"><span style="display:block;animation:heroRise 900ms var(--ease-out) both 300ms">marketing</span></span>
      <span style="display:block;overflow:hidden"><span style="display:block;animation:heroRise 900ms var(--ease-out) both 450ms"><span style="color:#F76E1E">ends</span> here.</span></span>
    </h1>
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px;margin-top:48px;animation:heroFade 800ms var(--ease-out) both 750ms">
      <p style="max-width:560px;margin:0;font-weight:600;font-size:18px;line-height:1.5;text-transform:uppercase;color:var(--fg3)"><span style="color:#000">One team owns the outcome.</span> Strategy, identity, content, campaigns, and technology — one synchronized system built for measurable growth.</p>
      <div style="display:flex;gap:16px">
        <x-import component-from-global-scope="AliveProStudiosDesignSystem_a3c754.Button" variant="primary" hint-size="auto,48px">Let's Talk</x-import>
        <x-import component-from-global-scope="AliveProStudiosDesignSystem_a3c754.Button" variant="dark" hint-size="auto,48px">The Alive Pro System</x-import>
      </div>
    </div>
  </main>
  <footer style="display:flex;justify-content:space-between;padding:0 clamp(24px,4vw,56px) 32px;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg3);animation:heroFade 800ms var(--ease-out) both 900ms">
    <span>Toronto, Canada</span>
    <span>Scroll for the system ↓</span>
  </footer>
</div>
</x-dc>
