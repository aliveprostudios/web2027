<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/alive-prostudios-design-system-a3c754b9-e5d8-4cbb-81f3-bac5a50d8847/colors_and_type.css">
  <link rel="stylesheet" href="_ds/alive-prostudios-design-system-a3c754b9-e5d8-4cbb-81f3-bac5a50d8847/styles.css">
  <script src="_ds/alive-prostudios-design-system-a3c754b9-e5d8-4cbb-81f3-bac5a50d8847/_ds_bundle.js"></script>
  <style>
    body{margin:0;background:#fff}
    a{color:#346632;text-decoration:none} a:hover{color:#F76E1E}
    @keyframes heroRise{from{transform:translateY(110%);opacity:0}to{transform:translateY(0);opacity:1}}
  </style>
</helmet>
<div style="font-family:var(--font-sans);background:#fff" data-screen-label="Services">
  <section data-screen-label="Services hero" style="background:var(--forest-900);color:#fff;padding-bottom:96px">
    <dc-import name="SiteNav" active="services" hint-size="100%,96px"></dc-import>
    <div style="padding:64px clamp(24px,4vw,56px) 0">
      <p style="font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--brand-lime);margin:0 0 24px">(02)&nbsp;&nbsp;Services</p>
      <h1 style="font-family:var(--font-condensed);font-weight:800;font-size:clamp(72px,9.5vw,168px);line-height:0.9;margin:0;text-transform:uppercase">
        <span style="display:block;overflow:hidden"><span style="display:block;animation:heroRise 900ms var(--ease-out) both 150ms">Everything your</span></span>
        <span style="display:block;overflow:hidden"><span style="display:block;animation:heroRise 900ms var(--ease-out) both 300ms">brand needs. <span style="color:#F76E1E">Once.</span></span></span>
      </h1>
      <p style="max-width:560px;margin:40px 0 0;font-weight:600;font-size:18px;line-height:1.5;text-transform:uppercase;color:rgba(255,255,255,0.6)">Four stages, one lifecycle. <span style="color:#fff">Expand any stage</span> to see what's inside.</p>
    </div>
  </section>

  <section data-screen-label="Stage accordion" style="padding:96px clamp(24px,4vw,56px) 128px">
    <sc-for list="{{ stages }}" as="stage" hint-placeholder-count="4">
      <div style="border-top:1px solid var(--ink-200)">
        <button onClick="{{ stage.toggle }}" style="display:grid;grid-template-columns:140px 1fr auto;gap:32px;align-items:center;width:100%;background:none;border:none;cursor:pointer;text-align:left;padding:44px 0">
          <span style="font-family:var(--font-condensed);font-weight:800;font-size:64px;line-height:1;color:#F76E1E">{{ stage.num }}</span>
          <span>
            <span style="display:block;font-family:var(--font-condensed);font-weight:800;font-size:clamp(36px,4vw,64px);line-height:0.96;color:#000;text-transform:uppercase">{{ stage.title }}</span>
            <span style="display:block;margin-top:10px;font-weight:600;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg3)">{{ stage.tagline }}</span>
          </span>
          <span style="font-family:var(--font-condensed);font-weight:800;font-size:44px;color:#000">{{ stage.icon }}</span>
        </button>
        <sc-if value="{{ stage.open }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:140px 1fr;gap:32px;padding:0 0 56px">
            <span></span>
            <div>
              <p style="margin:0 0 32px;max-width:640px;font-weight:600;font-size:16px;line-height:1.5;text-transform:uppercase;color:var(--fg3)">{{ stage.description }}</p>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px 32px">
                <sc-for list="{{ stage.services }}" as="svc" hint-placeholder-count="6">
                  <div style="display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ink-100);padding:14px 0">
                    <span style="width:6px;height:6px;border-radius:999px;background:{{ stage.accent }};flex:none"></span>
                    <span style="font-weight:600;font-size:15px;color:#000">{{ svc }}</span>
                  </div>
                </sc-for>
              </div>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <div style="border-top:1px solid var(--ink-200)"></div>
  </section>

  <section data-screen-label="Services CTA" style="background:var(--brand-orange);color:#fff;padding:112px clamp(24px,4vw,56px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:40px">
    <h2 style="font-family:var(--font-condensed);font-weight:800;font-size:clamp(48px,5.5vw,96px);line-height:0.94;margin:0;text-transform:uppercase;max-width:12em">Not sure where to start. <span style="color:#000">Start with the audit.</span></h2>
    <x-import component-from-global-scope="AliveProStudiosDesignSystem_a3c754.Button" variant="dark" hint-size="auto,48px">Request a Quote</x-import>
  </section>

  <footer style="background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:32px clamp(24px,4vw,56px);font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase">
    <a href="Home.dc.html" style="color:#fff">← Alive ProStudios</a>
    <span style="color:rgba(255,255,255,0.45)">© 2026 · Est. 1997 · Toronto</span>
    <a href="Work.dc.html" style="color:#fff">Next: The Work →</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: 0 };
  renderVals() {
    const data = [
      ['01','Foundation','Brand clarity, foundation and blueprint','#7FAD7C',
        'Before anything ships, we set the strategic foundation every later stage builds on.',
        ['Brand strategy','Positioning','Naming','Brand voice','Rebrand programs','Brand blueprint']],
      ['02','Execution','Brand execution, systems and market presence','#95C83F',
        'The foundation becomes a visible, synchronized presence across every channel.',
        ['Communication design','Web design & build','Collateral systems','Video & motion','Photo & AI production','Social branding']],
      ['03','Growth','Revenue-driven marketing and demand generation','#F76E1E',
        'Presence turns into pipeline — measured, optimized, and reported without spin.',
        ['Funnels & lead gen','Digital marketing','Content programs','Social management','Retention & reputation','SEO / AEO']],
      ['04','Infrastructure','Ongoing growth and market leadership','#346632',
        'The system keeps compounding: technology, dashboards, and lifecycle support.',
        ['Solution architecture','Custom apps','Systems integration','Dashboards','Lifecycle support','Innovation lab']],
    ];
    return {
      stages: data.map(([num,title,tagline,accent,description,services], i) => ({
        num, title, tagline, accent, description, services,
        open: this.state.open === i,
        icon: this.state.open === i ? '−' : '+',
        toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })),
      })),
    };
  }
}
</script>
</body>
</html>
