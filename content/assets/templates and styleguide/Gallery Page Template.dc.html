    body{margin:0;background:var(--pg-bg);--pg-bg:#FFFFFF;--pg-fg:#000000;--pg-fg2:rgba(0,0,0,0.72);--pg-fg3:rgba(0,0,0,0.55);--pg-line:#E6E7E8;--pg-band:#F4F4F4}

    a{color:#346632;text-decoration:none} a:hover{color:#F76E1E}
    body[data-theme="dark"] a{color:#95C83F}

    @keyframes ctaMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    @keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.55;transform:scale(0.82)}}
    @media (max-width:760px){
      [data-stack]{display:flex !important;flex-direction:column !important;align-items:flex-start !important;gap:24px !important}
    }
    @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
  </style>
</helmet>

    <div style="position:absolute;top:0;bottom:0;left:calc(clamp(24px,4vw,56px) + (100% - clamp(24px,4vw,56px)*2)*0.5);width:1px;background:rgba(128,128,128,0.12)"><div style="position:absolute;left:0;width:1px;height:5%;background:linear-gradient(180deg,rgba(247,110,30,0) 0%,rgba(247,110,30,0.4) 50%,rgba(247,110,30,0) 100%);animation:lineSweep 30s linear infinite 14s"></div></div>
    <div style="position:absolute;top:0;bottom:0;left:calc(clamp(24px,4vw,56px) + (100% - clamp(24px,4vw,56px)*2)*0.75);width:1px;background:rgba(128,128,128,0.12)"><div style="position:absolute;left:0;width:1px;height:5%;background:linear-gradient(180deg,rgba(128,128,128,0) 0%,rgba(128,128,128,0.4) 50%,rgba(128,128,128,0) 100%);animation:lineSweep 38s linear infinite 3s"></div></div>

      </h1>

  <section data-screen-label="Gallery grid" style="padding:96px clamp(24px,4vw,56px)">

      </button>
      <button aria-label="Next image" onClick="{{ next }}" style="position:absolute;right:clamp(8px,3vw,48px);top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:999px;border:1px solid rgba(255,255,255,0.4);background:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color 220ms ease,color 220ms ease" style-hover="border-color:#F76E1E;color:#F76E1E">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>

        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg>
      </button>
      <span style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:13px;letter-spacing:0.1em;color:rgba(255,255,255,0.7)">{{ lbCounter }}</span>
    </div>
  </sc-if>

  <dc-import name="BookConsult" hint-size="100%,640px"></dc-import>

    <a href="Home Page Template.dc.html" style="color:#fff">← Alive ProStudios</a>
    <span style="color:rgba(255,255,255,0.45)">Alive ProStudios Inc. Toronto, Canada</span>
    <a href="Master Page Template.dc.html" style="color:#fff">All Services →</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // GALLERY IMAGES — Astro replaces this array with the photo folder collection
  // (import.meta.glob over the designated folder). The grid, counter, and
  // slideshow all derive from the array length — any photo count works.
  static MOCK_COUNT = 24;
  state = { lbOpen: false, lbIndex: 0 };
  componentWillUnmount() { clearInterval(this._timer); }
  startAutoSlide() {
    clearInterval(this._timer);
    this._timer = setInterval(() => this.step(1), 2000);
  }
  step(d) {
    const n = this._count || 1;
    this.setState(s => ({ lbIndex: (s.lbIndex + d + n) % n }));
  }
  renderVals() {
    const images = Array.from({ length: Component.MOCK_COUNT }, (_, i) => ({
      thumb: 'https://picsum.photos/seed/aps-gallery-' + (i + 1) + '/800/600',
      full: 'https://picsum.photos/seed/aps-gallery-' + (i + 1) + '/900/675',
      alt: 'Gallery image ' + (i + 1),
      open: () => { this.setState({ lbOpen: true, lbIndex: i }); this.startAutoSlide(); },
    }));
    this._count = images.length;
    const idx = Math.min(this.state.lbIndex, images.length - 1);
    return {
      images,
      lbOpen: this.state.lbOpen,
      lbSrc: images[idx].full,
      lbCounter: String(idx + 1).padStart(2, '0') + ' / ' + images.length,
      close: () => { clearInterval(this._timer); this.setState({ lbOpen: false }); },
      next: () => { this.step(1); this.startAutoSlide(); },
      prev: () => { this.step(-1); this.startAutoSlide(); },
    };
  }
}
</script>
