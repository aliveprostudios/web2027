<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/alive-prostudios-design-system-a3c754b9-e5d8-4cbb-81f3-bac5a50d8847/colors_and_type.css">
  <link rel="stylesheet" href="_ds/alive-prostudios-design-system-a3c754b9-e5d8-4cbb-81f3-bac5a50d8847/styles.css">
  <style>
    @keyframes navFade{from{opacity:0}to{opacity:1}}
    @keyframes navRise{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  </style>
</helmet>
<div style="font-family:var(--font-sans)">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:28px clamp(24px,4vw,56px)">
    <a href="Home Page Template.dc.html" style="display:block"><img src="assets/logo-full-white.svg" alt="Alive ProStudios" style="height:40px;display:block"></a>
    <div style="display:flex;align-items:center;gap:28px">
      <span style="font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.75)">Est. 1997</span>
      <button aria-label="Toggle light and dark mode" onClick="{{ toggleTheme }}" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:none;border:1px solid rgba(255,255,255,0.35);border-radius:999px;cursor:pointer;color:#fff" style-hover="border-color:#F76E1E">
        <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        </sc-if>
        <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </sc-if>
      </button>
      <button aria-label="Menu" onClick="{{ open }}" style="display:flex;flex-direction:column;gap:6px;background:none;border:none;cursor:pointer;padding:8px">
        <span style="display:block;width:30px;height:3px;background:#fff"></span>
        <span style="display:block;width:30px;height:3px;background:#fff"></span>
      </button>
    </div>
  </header>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:100;background:var(--brand-orange);display:flex;flex-direction:column;animation:navFade 300ms var(--ease-out) both">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:28px clamp(24px,4vw,56px)">
        <img src="assets/logo-full-white.svg" alt="Alive ProStudios" style="height:40px;display:block">
        <button aria-label="Close menu" onClick="{{ close }}" style="position:relative;width:44px;height:44px;background:none;border:none;cursor:pointer">
          <span style="position:absolute;left:7px;top:20px;width:30px;height:3px;background:#fff;transform:rotate(45deg)"></span>
          <span style="position:absolute;left:7px;top:20px;width:30px;height:3px;background:#fff;transform:rotate(-45deg)"></span>
        </button>
      </div>
      <nav style="flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:flex-start;padding:16px clamp(24px,4vw,56px) 24px">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="8">
          <div style="border-bottom:1px solid rgba(255,255,255,0.25)">
            <sc-if value="{{ link.hasChildren }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ link.toggle }}" style="display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;background:none;border:none;cursor:pointer;text-align:left;padding:16px 0;animation:navRise 500ms var(--ease-out) both;transform:translateX(0);transition:transform 350ms cubic-bezier(0.22,1,0.36,1)" style-hover="transform:translateX(8px)">
                <span style="display:flex;align-items:baseline;gap:16px;min-width:0">
                  <span style="font-family:var(--font-mono);font-size:11px;color:rgba(0,0,0,0.55);width:24px;flex:none">{{ link.num }}</span>
                  <span style="font-family:var(--font-sans);font-weight:200;font-size:22px;line-height:1.1;letter-spacing:0.04em;text-transform:uppercase;color:{{ link.color }}">{{ link.label }}</span>
                </span>
                <span style="font-family:var(--font-sans);font-weight:300;font-size:22px;line-height:1;color:#fff;flex:none">{{ link.icon }}</span>
              </button>
              <sc-if value="{{ link.open }}" hint-placeholder-val="{{ false }}">
                <ul style="margin:0 0 20px;padding:0 0 0 40px;list-style:none;display:flex;flex-direction:column;gap:12px;animation:navFade 350ms cubic-bezier(0.22,1,0.36,1) both">
                  <sc-for list="{{ link.children }}" as="sub" hint-placeholder-count="4">
                    <li>
                      <a href="{{ link.href }}" style="display:inline-flex;align-items:center;gap:12px;font-size:16px;font-weight:500;color:#fff;text-decoration:none;transform:translateX(0);transition:transform 350ms cubic-bezier(0.22,1,0.36,1),color 250ms ease" style-hover="color:#000;transform:translateX(6px)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;opacity:0.7"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
                        <span>{{ sub }}</span>
                      </a>
                    </li>
                  </sc-for>
                </ul>
              </sc-if>
            </sc-if>
            <sc-if value="{{ link.isPlain }}" hint-placeholder-val="{{ true }}">
              <a href="{{ link.href }}" style="display:flex;align-items:center;gap:16px;text-decoration:none;padding:16px 0;animation:navRise 500ms var(--ease-out) both;transform:translateX(0);transition:transform 350ms cubic-bezier(0.22,1,0.36,1)" style-hover="transform:translateX(8px)">
                <span style="font-family:var(--font-mono);font-size:11px;color:rgba(0,0,0,0.55);width:24px;flex:none">{{ link.num }}</span>
                <span style="font-family:var(--font-sans);font-weight:200;font-size:22px;line-height:1.1;letter-spacing:0.04em;text-transform:uppercase;color:{{ link.color }}">{{ link.label }}</span>
              </a>
            </sc-if>
          </div>
        </sc-for>
      </nav>
      <div style="display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;padding:16px clamp(24px,4vw,56px) 28px;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(0,0,0,0.55)">
        <span>Toronto, Canada</span>
        <span>info@aliveprostudios.com</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:&quot;96px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;work&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false, theme: 'light', openSection: -1 };
  componentDidMount() {
    const t = localStorage.getItem('aps-theme') || 'light';
    this.applyTheme(t);
  }
  applyTheme(t) {
    document.body.setAttribute('data-theme', t);
    localStorage.setItem('aps-theme', t);
    this.setState({ theme: t });
  }
  renderVals() {
    const active = this.props.active ?? 'home';
    const pages = [
      ['01','Foundation','Master Page Template.dc.html',['Brand Strategy & Positioning','Brand Name & Identity','Brand Voice','Rebranding']],
      ['02','Execution','Master Page Template.dc.html',['Communication Design','Web Solutions','Sales & Marketing Collateral','Video Production','Motion Graphics & Animation','Photography','AI-Generated Production','Social Media Branding']],
      ['03','Growth','Master Page Template.dc.html',['Sales Funnel Building','Digital Marketing','Lead Generation','Content Marketing','Marketing Innovation','Ongoing Brand Guardianship','Social Media Management','Customer Retention Marketing','Reputation Management','AEO (Answer Engine Optimization)','SEO (Search Engine Optimization)']],
      ['04','Infrastructure','Master Page Template.dc.html',['Solution Architecture & Design','Custom App Development','Intelligent Systems Integration','Dashboards & Analytics','LifeCycle Support']],
      ['05','Work','Gallery Page Template.dc.html',null],
      ['06','Alive Pro','Master Page Template.dc.html',['Why Alive Pro','Our Process','About Us','What to Expect','Partnership','Our Philosophy','Testimonials','Precision Impact Sprints']],
      ['07','Resources','#',null],
      ['08','Contact','#',null],
    ];
    return {
      menuOpen: this.state.menuOpen,
      toggleTheme: () => this.applyTheme(this.state.theme === 'light' ? 'dark' : 'light'),
      isLight: this.state.theme === 'light',
      isDark: this.state.theme === 'dark',
      open: () => this.setState({ menuOpen: true }),
      close: () => this.setState({ menuOpen: false }),
      links: pages.map(([num,label,href,children], i) => ({
        num, label, href,
        children: children || [],
        hasChildren: !!children,
        isPlain: !children,
        open: this.state.openSection === i,
        icon: this.state.openSection === i ? '−' : '+',
        toggle: () => this.setState(s => ({ openSection: s.openSection === i ? -1 : i })),
        color: label.toLowerCase() === active ? '#000000' : '#FFFFFF',
      })),
    };
  }
}
</script>
</body>
</html>
