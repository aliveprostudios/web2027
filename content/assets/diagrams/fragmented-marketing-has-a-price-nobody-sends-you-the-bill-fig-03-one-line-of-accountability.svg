<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram contrasting two structures: on the left the business owner sits at the centre with spokes out to five separate suppliers and every coordination line running through them, labelled you are the integration layer; on the right one line of accountability runs from the business to a single accountable team that holds the specialists behind it.">
  <defs>
    <pattern id="fm-grid-c" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#C7D2D9" stroke-width="0.6"/>
    </pattern>
    <marker id="fm-arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F76E1E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="400" fill="#EEF2F4"/>
  <rect x="0" y="0" width="700" height="400" fill="url(#fm-grid-c)"/>
  <rect x="2" y="2" width="696" height="396" fill="none" stroke="#14181E" stroke-width="1.5" rx="4"/>
  <text x="24" y="32" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#B84A0E" font-weight="600">FIG. 03</text>
  <text x="24" y="50" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="1" fill="#14181E" font-weight="600">ONE LINE OF ACCOUNTABILITY</text>
  <circle cx="662" cy="34" r="14" fill="none" stroke="#14181E" stroke-width="1.2"/>
  <line x1="662" y1="22" x2="662" y2="46" stroke="#14181E" stroke-width="1"/>
  <line x1="650" y1="34" x2="674" y2="34" stroke="#14181E" stroke-width="1"/>
  <line x1="350" y1="72" x2="350" y2="366" stroke="#5B6472" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="186" y="88" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="1.4" fill="#14181E" font-weight="600">FRAGMENTED</text>
  <text x="510" y="88" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="1.4" fill="#B84A0E" font-weight="600">UNIFIED</text>
  <line x1="186" y1="205" x2="186" y2="113" stroke="#14181E" stroke-width="1.2"/>
  <line x1="186" y1="205" x2="273" y2="177" stroke="#14181E" stroke-width="1.2"/>
  <line x1="186" y1="205" x2="240" y2="279" stroke="#14181E" stroke-width="1.2"/>
  <line x1="186" y1="205" x2="132" y2="279" stroke="#14181E" stroke-width="1.2"/>
  <line x1="186" y1="205" x2="99" y2="177" stroke="#14181E" stroke-width="1.2"/>
  <rect x="148" y="102" width="76" height="22" fill="#F7F6F2" stroke="#14181E" stroke-width="1.2" rx="3"/>
  <text x="186" y="117" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#14181E">DESIGNER</text>
  <rect x="235" y="166" width="76" height="22" fill="#F7F6F2" stroke="#14181E" stroke-width="1.2" rx="3"/>
  <text x="273" y="181" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#14181E">ADS</text>
  <rect x="202" y="268" width="76" height="22" fill="#F7F6F2" stroke="#14181E" stroke-width="1.2" rx="3"/>
  <text x="240" y="283" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#14181E">SOCIAL</text>
  <rect x="94" y="268" width="76" height="22" fill="#F7F6F2" stroke="#14181E" stroke-width="1.2" rx="3"/>
  <text x="132" y="283" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#14181E">WEB</text>
  <rect x="61" y="166" width="76" height="22" fill="#F7F6F2" stroke="#14181E" stroke-width="1.2" rx="3"/>
  <text x="99" y="181" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#14181E">COPY</text>
  <circle cx="186" cy="205" r="28" fill="#F76E1E" stroke="#14181E" stroke-width="1.5"/>
  <text x="186" y="210" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#14181E">YOU</text>
  <text x="186" y="334" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#14181E">You are the integration layer.</text>
  <text x="186" y="352" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="11.5" fill="#5B6472">Every line runs through you, unpaid.</text>
  <rect x="425" y="105" width="170" height="30" fill="#F7F6F2" stroke="#14181E" stroke-width="1.4" rx="3"/>
  <text x="510" y="125" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#14181E">YOUR BUSINESS</text>
  <line x1="510" y1="135" x2="510" y2="172" stroke="#F76E1E" stroke-width="3" marker-end="url(#fm-arr-c)"/>
  <rect x="405" y="179" width="210" height="34" fill="#F7F6F2" stroke="#F76E1E" stroke-width="2.2" rx="3"/>
  <text x="510" y="201" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#14181E">ONE ACCOUNTABLE TEAM</text>
  <line x1="510" y1="213" x2="510" y2="250" stroke="#F76E1E" stroke-width="3" marker-end="url(#fm-arr-c)"/>
  <rect x="385" y="256" width="250" height="34" fill="#F7F6F2" stroke="#14181E" stroke-width="1.3" rx="3"/>
  <line x1="447" y1="256" x2="447" y2="264" stroke="#C7D2D9" stroke-width="1"/>
  <line x1="447" y1="282" x2="447" y2="290" stroke="#C7D2D9" stroke-width="1"/>
  <line x1="510" y1="256" x2="510" y2="264" stroke="#C7D2D9" stroke-width="1"/>
  <line x1="510" y1="282" x2="510" y2="290" stroke="#C7D2D9" stroke-width="1"/>
  <line x1="573" y1="256" x2="573" y2="264" stroke="#C7D2D9" stroke-width="1"/>
  <line x1="573" y1="282" x2="573" y2="290" stroke="#C7D2D9" stroke-width="1"/>
  <text x="510" y="278" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" fill="#5B6472">SPECIALISTS, ONE BRIEF</text>
  <text x="510" y="334" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#14181E">One line of accountability.</text>
  <text x="510" y="352" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="11.5" fill="#5B6472">One place to go when it fails.</text>
  <text x="24" y="382" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#14181E" font-weight="600">THE WORK IS THE SAME. THE ACCOUNTABILITY IS NOT.</text>
</svg>
