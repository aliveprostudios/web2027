<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram comparing a floodlight, whose scattered light cannot pass through a barrier labeled market noise, with a laser, whose concentrated beam cuts through the same barrier to reach an ideal client target.">
  <defs>
    <pattern id="grid2" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#C7D2D9" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="700" height="340" fill="#EEF2F4"/>
  <rect x="0" y="0" width="700" height="340" fill="url(#grid2)"/>
  <rect x="2" y="2" width="696" height="336" fill="none" stroke="#14181E" stroke-width="1.5" rx="4"/>

  <text x="24" y="32" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5" fill="#A97C35" font-weight="600">FIG. 02</text>
  <text x="24" y="50" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1" fill="#14181E" font-weight="600">FLOODLIGHT VS. LASER</text>

  <line x1="350" y1="70" x2="350" y2="320" stroke="#14181E" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="350" cy="60" r="15" fill="#F7F6F2" stroke="#14181E" stroke-width="1.2"/>
  <text x="350" y="65" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#14181E" font-weight="600">VS</text>

  <!-- Floodlight panel -->
  <text x="150" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#14181E">FLOODLIGHT</text>
  <circle cx="70" cy="180" r="10" fill="#14181E"/>
  <g stroke="#A97C35" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75">
    <line x1="78" y1="180" x2="270" y2="110"/>
    <line x1="78" y1="180" x2="270" y2="145"/>
    <line x1="78" y1="180" x2="270" y2="180"/>
    <line x1="78" y1="180" x2="270" y2="215"/>
    <line x1="78" y1="180" x2="270" y2="250"/>
  </g>
  <line x1="270" y1="100" x2="270" y2="262" stroke="#14181E" stroke-width="2"/>
  <g opacity="0.55">
    <circle cx="284" cy="115" r="2" fill="#A97C35"/>
    <circle cx="290" cy="150" r="2" fill="#A97C35"/>
    <circle cx="282" cy="182" r="2" fill="#A97C35"/>
    <circle cx="292" cy="216" r="2" fill="#A97C35"/>
    <circle cx="284" cy="248" r="2" fill="#A97C35"/>
  </g>
  <text x="270" y="285" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="0.5" fill="#5B6472">MARKET NOISE</text>
  <text x="150" y="308" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="0.5" fill="#5B6472">SAME ENERGY, SPREAD THIN</text>
  <text x="150" y="322" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#C1441E">DIM. EVERYWHERE.</text>

  <!-- Laser panel -->
  <text x="550" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#14181E">LASER</text>
  <rect x="410" y="174" width="16" height="12" fill="#14181E"/>
  <polygon points="426,172 440,180 426,188" fill="#14181E"/>
  <line x1="440" y1="180" x2="600" y2="180" stroke="#C1441E" stroke-width="2.6"/>
  <line x1="430" y1="100" x2="430" y2="262" stroke="#14181E" stroke-width="2"/>
  <line x1="430" y1="176" x2="430" y2="184" stroke="#F7F6F2" stroke-width="4"/>
  <circle cx="620" cy="180" r="16" fill="none" stroke="#14181E" stroke-width="1.3"/>
  <circle cx="620" cy="180" r="9" fill="none" stroke="#14181E" stroke-width="1.3"/>
  <circle cx="620" cy="180" r="3" fill="#C1441E"/>
  <text x="620" y="215" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="0.5" fill="#5B6472">IDEAL CLIENT</text>
  <text x="430" y="285" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="0.5" fill="#5B6472">MARKET NOISE</text>
  <text x="530" y="308" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="0.5" fill="#5B6472">SAME ENERGY, ONE POINT</text>
  <text x="530" y="322" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#A97C35">CUTS THROUGH.</text>
</svg>
