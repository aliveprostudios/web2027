<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loop diagram showing connected work producing clean data, clean data producing faster decisions, faster decisions freeing capacity, and freed capacity reinvested into the system, compounding into control.">
  <defs>
    <pattern id="sys-grid-c" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#C7D2D9" stroke-width="0.6"/>
    </pattern>
    <marker id="sys-arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14181E"/>
    </marker>
    <marker id="sys-arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F76E1E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="400" fill="#EEF2F4"/>
  <rect x="0" y="0" width="700" height="400" fill="url(#sys-grid-c)"/>
  <rect x="2" y="2" width="696" height="396" fill="none" stroke="#14181E" stroke-width="1.5" rx="4"/>

  <text x="24" y="32" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#B84A0E" font-weight="600">FIG. 03</text>
  <text x="24" y="50" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="1" fill="#14181E" font-weight="600">THE COMPOUNDING LOOP</text>

  <circle cx="662" cy="34" r="14" fill="none" stroke="#14181E" stroke-width="1.2"/>
  <line x1="662" y1="22" x2="662" y2="46" stroke="#14181E" stroke-width="1"/>
  <line x1="650" y1="34" x2="674" y2="34" stroke="#14181E" stroke-width="1"/>

  <circle cx="350" cy="232" r="76" fill="none" stroke="#F76E1E" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="350" y="227" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="1.4" fill="#14181E" font-weight="600">CONTROL</text>
  <text x="350" y="249" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="1.4" fill="#14181E" font-weight="600">COMPOUNDS</text>

  <g fill="none" stroke="#14181E" stroke-width="1.6" marker-end="url(#sys-arr-c)">
    <path d="M 452 121 Q 528 130 534 201"/>
    <path d="M 534 263 Q 528 334 452 343"/>
    <path d="M 248 343 Q 172 334 166 263"/>
  </g>
  <path d="M 166 201 Q 172 130 248 121" fill="none" stroke="#F76E1E" stroke-width="1.8" marker-end="url(#sys-arr-d)"/>

  <g font-family="Barlow, system-ui, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1" fill="#14181E" text-anchor="middle">
    <rect x="252" y="93" width="196" height="46" fill="#F7F6F2" stroke="#14181E" stroke-width="1.4" rx="3"/>
    <text x="350" y="121">CONNECTED WORK</text>

    <rect x="448" y="209" width="176" height="46" fill="#F7F6F2" stroke="#14181E" stroke-width="1.4" rx="3"/>
    <text x="536" y="237">CLEAN DATA</text>

    <rect x="252" y="325" width="196" height="46" fill="#F7F6F2" stroke="#14181E" stroke-width="1.4" rx="3"/>
    <text x="350" y="353">FASTER DECISIONS</text>

    <rect x="76" y="209" width="176" height="46" fill="#F7F6F2" stroke="#14181E" stroke-width="1.4" rx="3"/>
    <text x="164" y="237">FREED CAPACITY</text>
  </g>

  <g font-family="Barlow, system-ui, sans-serif" font-size="11.5" fill="#5B6472" text-anchor="middle">
    <text x="455" y="170">as a by-product</text>
    <text x="455" y="300">less to argue about</text>
    <text x="245" y="300">coordination time back</text>
  </g>
  <text x="245" y="170" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="11.5" fill="#B84A0E" font-weight="600">reinvested</text>
</svg>
