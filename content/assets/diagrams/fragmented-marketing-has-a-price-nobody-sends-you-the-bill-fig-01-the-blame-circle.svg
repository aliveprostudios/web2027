<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of five marketing roles arranged in a ring, each pointing blame at the next, with the centre of the ring empty and labelled who owns the outcome.">
  <defs>
    <pattern id="fm-grid-a" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#C7D2D9" stroke-width="0.6"/>
    </pattern>
    <marker id="fm-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14181E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="400" fill="#EEF2F4"/>
  <rect x="0" y="0" width="700" height="400" fill="url(#fm-grid-a)"/>
  <rect x="2" y="2" width="696" height="396" fill="none" stroke="#14181E" stroke-width="1.5" rx="4"/>
  <text x="24" y="32" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#B84A0E" font-weight="600">FIG. 01</text>
  <text x="24" y="50" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="1" fill="#14181E" font-weight="600">THE BLAME CIRCLE</text>
  <circle cx="662" cy="34" r="14" fill="none" stroke="#14181E" stroke-width="1.2"/>
  <line x1="662" y1="22" x2="662" y2="46" stroke="#14181E" stroke-width="1"/>
  <line x1="650" y1="34" x2="674" y2="34" stroke="#14181E" stroke-width="1"/>
  <line x1="409" y1="130" x2="510" y2="169" stroke="#14181E" stroke-width="1.5" marker-end="url(#fm-arr-a)"/>
  <text x="480" y="134" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="11" font-style="italic" fill="#B84A0E">blames</text>
  <line x1="552" y1="218" x2="502" y2="298" stroke="#14181E" stroke-width="1.5" marker-end="url(#fm-arr-a)"/>
  <text x="553" y="262" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="11" font-style="italic" fill="#B84A0E">blames</text>
  <line x1="413" y1="325" x2="287" y2="325" stroke="#14181E" stroke-width="1.5" marker-end="url(#fm-arr-a)"/>
  <text x="350" y="351" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="11" font-style="italic" fill="#B84A0E">blames</text>
  <line x1="198" y1="298" x2="148" y2="218" stroke="#14181E" stroke-width="1.5" marker-end="url(#fm-arr-a)"/>
  <text x="147" y="262" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="11" font-style="italic" fill="#B84A0E">blames</text>
  <line x1="190" y1="169" x2="291" y2="130" stroke="#14181E" stroke-width="1.5" marker-end="url(#fm-arr-a)"/>
  <text x="220" y="134" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="11" font-style="italic" fill="#B84A0E">blames</text>
  <ellipse cx="350" cy="228" rx="95" ry="52" fill="none" stroke="#F76E1E" stroke-width="1.1" stroke-dasharray="4 5"/>
  <text x="350" y="221" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" letter-spacing="1.4" fill="#14181E" font-weight="600">WHO OWNS</text>
  <text x="350" y="245" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13.5" letter-spacing="1.4" fill="#14181E" font-weight="600">THE OUTCOME?</text>
  <rect x="287" y="89" width="126" height="38" fill="#F7F6F2" stroke="#14181E" stroke-width="1.4" rx="3"/>
  <text x="350" y="113" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#14181E">STRATEGIST</text>
  <rect x="506" y="172" width="126" height="38" fill="#F7F6F2" stroke="#14181E" stroke-width="1.4" rx="3"/>
  <text x="569" y="196" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#14181E">DESIGNER</text>
  <rect x="422" y="306" width="126" height="38" fill="#F7F6F2" stroke="#14181E" stroke-width="1.4" rx="3"/>
  <text x="485" y="330" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#14181E">COPYWRITER</text>
  <rect x="152" y="306" width="126" height="38" fill="#F7F6F2" stroke="#14181E" stroke-width="1.4" rx="3"/>
  <text x="215" y="330" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#14181E">MEDIA BUYER</text>
  <rect x="68" y="172" width="126" height="38" fill="#F7F6F2" stroke="#14181E" stroke-width="1.4" rx="3"/>
  <text x="131" y="196" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#14181E">SOCIAL</text>
  <text x="24" y="382" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#14181E" font-weight="600">NOBODY IN THE RING WAS HIRED TO OWN THE RESULT.</text>
</svg>
