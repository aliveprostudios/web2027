<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of a four-stage sequence, diagnose then decide then produce then distribute, with AI marked as belonging to the last two stages and a dashed bypass arrow labelled the quick fix skipping the first two.">
  <defs>
    <pattern id="qf-grid-c" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#C7D2D9" stroke-width="0.6"/>
    </pattern>
    <marker id="qf-arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14181E"/>
    </marker>
    <marker id="qf-arr-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F76E1E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="400" fill="#EEF2F4"/>
  <rect x="0" y="0" width="700" height="400" fill="url(#qf-grid-c)"/>
  <rect x="2" y="2" width="696" height="396" fill="none" stroke="#14181E" stroke-width="1.5" rx="4"/>

  <text x="24" y="32" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#B84A0E" font-weight="600">FIG. 03</text>
  <text x="24" y="50" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="1" fill="#14181E" font-weight="600">WHERE AI BELONGS</text>

  <circle cx="662" cy="34" r="14" fill="none" stroke="#14181E" stroke-width="1.2"/>
  <line x1="662" y1="22" x2="662" y2="46" stroke="#14181E" stroke-width="1"/>
  <line x1="650" y1="34" x2="674" y2="34" stroke="#14181E" stroke-width="1"/>

  <g stroke="#14181E" stroke-width="1.3" fill="none">
    <path d="M 37 140 L 37 130 L 339 130 L 339 140"/>
  </g>
  <text x="188" y="118" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="1.2" fill="#14181E" font-weight="600">JUDGMENT. A PERSON OWNS THIS.</text>

  <g stroke="#F76E1E" stroke-width="1.6" fill="none">
    <path d="M 361 140 L 361 130 L 663 130 L 663 140"/>
  </g>
  <text x="512" y="118" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="1.2" fill="#B84A0E" font-weight="600">AI BELONGS HERE</text>

  <g font-family="Barlow, system-ui, sans-serif" text-anchor="middle">
    <rect x="37" y="150" width="140" height="64" fill="#F7F6F2" stroke="#14181E" stroke-width="1.5" rx="3"/>
    <text x="107" y="182" font-size="14" font-weight="700" letter-spacing="1" fill="#14181E">DIAGNOSE</text>
    <text x="107" y="200" font-size="10.5" fill="#5B6472">what is actually wrong</text>

    <rect x="199" y="150" width="140" height="64" fill="#F7F6F2" stroke="#14181E" stroke-width="1.5" rx="3"/>
    <text x="269" y="182" font-size="14" font-weight="700" letter-spacing="1" fill="#14181E">DECIDE</text>
    <text x="269" y="200" font-size="10.5" fill="#5B6472">who it is for, and why</text>

    <rect x="361" y="150" width="140" height="64" fill="#F7F6F2" stroke="#F76E1E" stroke-width="2" rx="3"/>
    <text x="431" y="182" font-size="14" font-weight="700" letter-spacing="1" fill="#14181E">PRODUCE</text>
    <text x="431" y="200" font-size="10.5" fill="#5B6472">make the work</text>

    <rect x="523" y="150" width="140" height="64" fill="#F7F6F2" stroke="#F76E1E" stroke-width="2" rx="3"/>
    <text x="593" y="182" font-size="14" font-weight="700" letter-spacing="1" fill="#14181E">DISTRIBUTE</text>
    <text x="593" y="200" font-size="10.5" fill="#5B6472">get it seen</text>
  </g>

  <g stroke="#14181E" stroke-width="1.6" marker-end="url(#qf-arr-d)" fill="none">
    <line x1="179" y1="182" x2="195" y2="182"/>
    <line x1="341" y1="182" x2="357" y2="182"/>
    <line x1="503" y1="182" x2="519" y2="182"/>
  </g>

  <path d="M 62 224 C 150 285, 330 285, 412 226" fill="none" stroke="#F76E1E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#qf-arr-e)"/>
  <text x="240" y="302" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="1.2" fill="#B84A0E" font-weight="600">THE QUICK FIX</text>
  <text x="240" y="322" text-anchor="middle" font-family="Barlow, system-ui, sans-serif" font-size="11.5" fill="#5B6472">skips the two stages where the value was</text>

  <text x="24" y="370" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#14181E" font-weight="600">THE TOOLS ARE EXCELLENT AT TWO OF THESE FOUR STAGES.</text>
</svg>
