<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the Trust Ledger showing deposits and withdrawals balancing toward a trust reserve that produces referrals, pricing power, forgiveness and repeat business.">
  <defs>
    <pattern id="grid1" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#C7D2D9" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14181E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="400" fill="#EEF2F4"/>
  <rect x="0" y="0" width="700" height="400" fill="url(#grid1)"/>
  <rect x="2" y="2" width="696" height="396" fill="none" stroke="#14181E" stroke-width="1.5" rx="4"/>

  <text x="24" y="32" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.5" fill="#A97C35" font-weight="600">FIG. 01</text>
  <text x="24" y="50" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1" fill="#14181E" font-weight="600">THE TRUST LEDGER</text>

  <circle cx="662" cy="34" r="14" fill="none" stroke="#14181E" stroke-width="1.2"/>
  <line x1="662" y1="22" x2="662" y2="46" stroke="#14181E" stroke-width="1"/>
  <line x1="650" y1="34" x2="674" y2="34" stroke="#14181E" stroke-width="1"/>

  <line x1="350" y1="78" x2="350" y2="300" stroke="#14181E" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="175" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#A97C35">DEPOSITS</text>
  <text x="525" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#C1441E">WITHDRAWALS</text>

  <g font-family="Inter, sans-serif" font-size="14.5" fill="#20242B">
    <circle cx="68" cy="132" r="8" fill="none" stroke="#A97C35" stroke-width="1.4"/>
    <line x1="64" y1="132" x2="72" y2="132" stroke="#A97C35" stroke-width="1.4"/>
    <line x1="68" y1="128" x2="68" y2="136" stroke="#A97C35" stroke-width="1.4"/>
    <text x="86" y="137">Kept promises</text>

    <circle cx="68" cy="172" r="8" fill="none" stroke="#A97C35" stroke-width="1.4"/>
    <line x1="64" y1="172" x2="72" y2="172" stroke="#A97C35" stroke-width="1.4"/>
    <line x1="68" y1="168" x2="68" y2="176" stroke="#A97C35" stroke-width="1.4"/>
    <text x="86" y="177">Consistent delivery</text>

    <circle cx="68" cy="212" r="8" fill="none" stroke="#A97C35" stroke-width="1.4"/>
    <line x1="64" y1="212" x2="72" y2="212" stroke="#A97C35" stroke-width="1.4"/>
    <line x1="68" y1="208" x2="68" y2="216" stroke="#A97C35" stroke-width="1.4"/>
    <text x="86" y="217">Solves the real problem</text>

    <circle cx="68" cy="252" r="8" fill="none" stroke="#A97C35" stroke-width="1.4"/>
    <line x1="64" y1="252" x2="72" y2="252" stroke="#A97C35" stroke-width="1.4"/>
    <line x1="68" y1="248" x2="68" y2="256" stroke="#A97C35" stroke-width="1.4"/>
    <text x="86" y="257">Owns mistakes fast</text>
  </g>

  <g font-family="Inter, sans-serif" font-size="14.5" fill="#20242B">
    <circle cx="418" cy="132" r="8" fill="none" stroke="#C1441E" stroke-width="1.4"/>
    <line x1="414" y1="132" x2="422" y2="132" stroke="#C1441E" stroke-width="1.4"/>
    <text x="436" y="137">Broken promises</text>

    <circle cx="418" cy="172" r="8" fill="none" stroke="#C1441E" stroke-width="1.4"/>
    <line x1="414" y1="172" x2="422" y2="172" stroke="#C1441E" stroke-width="1.4"/>
    <text x="436" y="177">Generic service</text>

    <circle cx="418" cy="212" r="8" fill="none" stroke="#C1441E" stroke-width="1.4"/>
    <line x1="414" y1="212" x2="422" y2="212" stroke="#C1441E" stroke-width="1.4"/>
    <text x="436" y="217">Inconsistency</text>

    <circle cx="418" cy="252" r="8" fill="none" stroke="#C1441E" stroke-width="1.4"/>
    <line x1="414" y1="252" x2="422" y2="252" stroke="#C1441E" stroke-width="1.4"/>
    <text x="436" y="257">Silence when it matters</text>
  </g>

  <polygon points="335,296 365,296 350,278" fill="none" stroke="#14181E" stroke-width="1.3"/>
  <line x1="350" y1="278" x2="350" y2="262" stroke="#14181E" stroke-width="1.3"/>
  <text x="350" y="315" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" letter-spacing="1" fill="#14181E" font-weight="600">TRUST RESERVE</text>

  <line x1="350" y1="322" x2="350" y2="336" stroke="#14181E" stroke-width="1.3" marker-end="url(#arrow1)"/>

  <rect x="40" y="342" width="620" height="42" rx="3" fill="#F7F6F2" stroke="#14181E" stroke-width="1"/>
  <text x="350" y="368" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="#14181E">Referrals &#183; Premium pricing &#183; Forgiveness &#183; Repeat business</text>
</svg>
